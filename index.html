#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 100%,rgba(120,72,40,.16),transparent 55%);}

#app{
  position:relative;
  max-width:480px;
  min-height:100vh;min-height:100dvh;
  margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,243,224,.35),rgba(255,243,224,0) 30%);
  box-shadow:0 0 60px rgba(120,72,40,.25);
}

/* ===== 顶栏 ===== */
header{position:relative;z-index:5;display:flex;align-items:flex-start;justify-content:space-between;padding:2px 2px 8px;}
.brand h1{font-size:20px;font-weight:800;letter-spacing:4px;color:#6b4226;
  text-shadow:0 1px 0 rgba(255,255,255,.5);}
.brand .sub{font-size:9.5px;color:var(--ink-sub);letter-spacing:2px;margin-top:2px;}
.brand .score{font-size:11px;color:var(--ink-sub);margin-top:4px;}
.brand .score b{color:#c77f1f;font-size:13px;}
.iconbtns{display:flex;gap:8px;}
.icobtn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(253,246,233,.9);
  border:1.5px solid rgba(122,81,56,.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(122,81,56,.25);
  cursor:pointer;
}
.icobtn:active{transform:scale(.92);}
.icobtn svg{width:18px;height:18px;}

/* ===== 任务卡 + 师姐 ===== */
#stage{position:relative;display:flex;align-items:flex-end;min-height:172px;}
#quest{
  position:relative;z-index:2;
  background:var(--cream);
  border:2.5px solid var(--mint);
  border-radius:18px;
  padding:10px 16px 10px 14px;
  max-width:62%;
  box-shadow:0 4px 12px rgba(122,81,56,.22);
}
#quest .lv{font-size:16px;font-weight:800;color:#5a3d2b;letter-spacing:1px;}
#quest .goal{font-size:12px;color:#7a5a42;margin-top:3px;letter-spacing:.5px;}
#quest .goal b{font-weight:800;}
#quest .fails{font-size:10px;color:#b08a68;margin-top:3px;}
#shijie{
  position:absolute;right:2px;bottom:-6px;z-index:1;
  width:128px;pointer-events:auto;cursor:pointer;
  filter:drop-shadow(0 6px 10px rgba(122,81,56,.35));
  transition:transform .25s, filter .25s;
}
#shijie img{width:100%;display:block;}
#shijie.cheer{animation:cheer .8s ease;}
@keyframes cheer{25%{transform:translateY(-14px) rotate(-3deg);}55%{transform:translateY(-6px) rotate(2.5deg);}80%{transform:translateY(-10px);}}
#shijie.sad{filter:drop-shadow(0 6px 10px rgba(122,81,56,.35)) saturate(.35) brightness(.92);transform:rotate(-5deg) translateY(4px);}
#shijie.boost{animation:boostin .6s ease;}
@keyframes boostin{0%{transform:translateX(60px) scale(.6);opacity:0;}100%{transform:none;opacity:1;}}
/* 师姐气泡 */
#bubble{
  position:absolute;right:116px;bottom:88px;z-index:3;
  background:var(--cream);
  border:2px solid var(--mint);
  color:#4f7a5f;
  font-size:12px;font-weight:700;
  padding:7px 12px;border-radius:14px;
  box-shadow:0 4px 10px rgba(122,81,56,.25);
  opacity:0;transform:scale(.7);transform-origin:bottom right;
  transition:opacity .2s,transform .2s;
  max-width:190px;line-height:1.5;pointer-events:none;
}
#bubble.show{opacity:1;transform:scale(1);}
#bubble::after{content:"";position:absolute;right:-8px;bottom:10px;width:14px;height:14px;
  background:var(--cream);border-right:2px solid var(--mint);border-bottom:2px solid var(--mint);
  transform:rotate(-45deg);}

/* ===== 棋盘 ===== */
#boardwrap{
  margin-top:6px;
  background:linear-gradient(180deg,var(--frame),var(--frame-deep));
  border-radius:18px;
  padding:10px 10px 12px;
  box-shadow:0 8px 20px rgba(90,50,25,.4),inset 0 2px 0 rgba(255,220,180,.25);
}
#stepsline{
  text-align:left;
  padding:2px 0 8px 8px;
  color:#ffe4c4;
  font-size:14px;font-weight:700;letter-spacing:1px;
  text-shadow:0 1px 2px rgba(60,30,10,.5);
}
#stepsline b{font-size:18px;color:#fff;}
#stepsline .assist-tag{
  display:inline-block;margin-left:6px;
  background:var(--mint);color:#2c5b40;
  font-size:10px;font-weight:800;
  padding:2px 8px;border-radius:999px;vertical-align:2px;
  text-shadow:none;
}
#board{
  display:grid;grid-template-columns:repeat(9,1fr);gap:4px;
  background:rgba(60,35,18,.35);
  padding:6px;border-radius:12px;
}
.cell{
  position:relative;aspect-ratio:1;border-radius:6px;cursor:pointer;
  transition:transform .08s;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.1);
  overflow:hidden;
}
.cell::after{content:"";position:absolute;left:14%;top:10%;width:40%;height:22%;
  background:rgba(255,255,255,.5);border-radius:50%;opacity:.5;pointer-events:none;}
.cell:active{transform:scale(.9);}
.cell.c0{background:linear-gradient(180deg,var(--t-red-hi),var(--t-red) 45%);}
.cell.c1{background:linear-gradient(180deg,var(--t-yel-hi),var(--t-yel) 45%);}
.cell.c2{background:linear-gradient(180deg,var(--t-blu-hi),var(--t-blu) 45%);}
.cell.c3{background:linear-gradient(180deg,var(--t-grn-hi),var(--t-grn) 45%);}
.cell.pop{animation:cellpop .22s ease;}
@keyframes cellpop{40%{transform:scale(1.1);}}
.cell.guideflash{animation:gflash .6s ease 4;}
@keyframes gflash{50%{box-shadow:0 0 0 3px #fff,0 0 16px 4px rgba(255,255,255,.95),inset 0 -3px 0 rgba(0,0,0,.1);}}
/* 颜料泼溅（游戏内同款染色效果） */
.splash{position:absolute;inset:-30%;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at 50% 46%, var(--sc) 0 40%, transparent 41%),
    radial-gradient(circle at 16% 18%, var(--sc) 0 8%, transparent 9%),
    radial-gradient(circle at 84% 22%, var(--sc) 0 6%, transparent 7%),
    radial-gradient(circle at 22% 84%, var(--sc) 0 7%, transparent 8%),
    radial-gradient(circle at 80% 80%, var(--sc) 0 5%, transparent 6%),
    radial-gradient(circle at 60% 8%,  var(--sc) 0 4%, transparent 5%);
  border-radius:48% 52% 55% 45%/52% 46% 54% 48%;
  transform:scale(.15) rotate(-8deg);opacity:0;
  animation:splashin .36s ease-out forwards;
}
@keyframes splashin{
  0%{transform:scale(.15) rotate(-8deg);opacity:0;}
  30%{opacity:1;}
  62%{transform:scale(1.3) rotate(3deg);opacity:1;}
  100%{transform:scale(1.5) rotate(6deg);opacity:0;}
}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);
  transform:scale(0);animation:rip .38s ease-out forwards;pointer-events:none;z-index:3;}
@keyframes rip{to{transform:scale(2.6);opacity:0;}}
.shake{animation:shk .3s;}
@keyframes shk{20%,60%{transform:translateX(-4px);}40%,80%{transform:translateX(4px);}}

/* ===== 画笔（游戏内同款竖排改横排） ===== */
#brushes{
  margin-top:12px;
  background:rgba(253,246,233,.75);
  border:1.5px solid rgba(122,81,56,.25);
  border-radius:18px;
  padding:10px 8px 8px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  box-shadow:0 4px 12px rgba(122,81,56,.18);
}
.brush{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 2px;border-radius:14px;cursor:pointer;
  border:2.5px solid transparent;
  transition:border-color .15s,transform .12s;
}
.brush:active{transform:scale(.94);}
.brush .pen{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.brush .pen svg{width:34px;height:34px;transform:rotate(8deg);}
.brush .bn{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:1px;}
.brush .bn i{font-style:normal;color:#b08a68;margin-right:3px;font-size:10px;}
.brush.active{border-color:var(--red);background:rgba(255,255,255,.65);}
.brush.active .pen{animation:penbob 1.2s ease infinite;}
@keyframes penbob{50%{transform:translateY(-3px);}}
.brush.hintbtn{animation:hintshake .45s ease 3;}

/* ===== 按钮行 ===== */
#actions{margin-top:12px;display:flex;gap:10px;}

  border:1.5px solid rgba(122,81,56,.4);
  color:#6b4226;font-size:14px;font-weight:800;letter-spacing:2px;
  box-shadow:0 4px 10px rgba(122,81,56,.25);

}
.abtn:active{transform:scale(.96);}

#levelpanel{

#chips{

}
#chips::-webkit-scrollbar{width:4px;}
#chips::-webkit-scrollbar-thumb{background:rgba(122,81,56,.3);border-radius:2px;}
.chip{
  aspect-ratio:1;border-radius:8px;
  background:rgba(255,255,255,.6);
  border:1.5px solid rgba(122,81,56,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#7a5a42;
  cursor:pointer;
  transition:transform .1s;
}
.chip:active{transform:scale(.9);}
.chip.cur{
  background:linear-gradient(180deg,#fff8ec,#f0dcb8);
  border-color:rgba(122,81,56,.6);color:#6b4226;font-weight:800;
  box-shadow:0 3px 8px rgba(122,81,56,.35),inset 0 1px 0 rgba(255,255,255,.8);
}
.chip.done{background:#cdeed9;color:#2c6b45;border-color:#6fbf95;}
.chip.done.cur{
  background:linear-gradient(180deg,#fff8ec,#f0dcb8);
  border-color:rgba(122,81,56,.6);color:#6b4226;
}
.chip.lock{
  background:rgba(122,81,56,.07);
  border-color:rgba(122,81,56,.14);
  color:#c9b8a4;cursor:not-allowed;
}
.chip.lock svg{width:11px;height:11px;opacity:.6;}
.shake2{animation:shk .3s;}
@keyframes shk{20%,60%{transform:translateX(-4px);}40%,80%{transform:translateX(4px);}}

/* ===== 页脚 ===== */
footer{margin-top:auto;padding-top:10px;text-align:center;font-size:9px;color:rgba(122,81,56,.55);letter-spacing:1px;line-height:1.7;}

/* =====  toast ===== */
#toast{
  position:fixed;left:50%;top:16%;transform:translateX(-50%) translateY(-8px);
  background:rgba(70,45,28,.92);color:#ffe9cf;
  font-size:13px;font-weight:700;letter-spacing:1px;
  padding:9px 18px;border-radius:999px;
  box-shadow:0 6px 16px rgba(60,35,15,.4);
  opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;
  white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== 胜利遮罩 ===== */
#overlay{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:center;justify-content:center;
  background:rgba(80,50,28,.45);backdrop-filter:blur(3px);padding:24px;
}
#overlay.show{display:flex;}
.card{
  width:100%;max-width:330px;
  background:var(--cream);
  border:2.5px solid var(--mint);
  border-radius:20px;padding:24px 20px 20px;text-align:center;
  box-shadow:0 18px 44px rgba(80,50,25,.45);
  animation:cardin .28s ease;
}
@keyframes cardin{from{transform:translateY(16px) scale(.96);opacity:0;}}
.card .big{font-size:24px;font-weight:800;letter-spacing:3px;color:#2f8f5b;margin-bottom:8px;}
.card .sub{font-size:12.5px;color:var(--ink-sub);line-height:1.7;margin-bottom:12px;}
.card .sub b{color:#c77f1f;}
.card .gain{font-size:15px;font-weight:800;color:#c77f1f;margin-bottom:16px;}
.btnrow{display:flex;gap:10px;}
.btn{
  flex:1;padding:12px 0;border-radius:12px;border:none;cursor:pointer;
  font-size:14px;font-weight:800;letter-spacing:2px;color:#fff;
  background:linear-gradient(180deg,#66c893,#3fa668);
  box-shadow:0 6px 14px rgba(63,166,104,.4);
}
.btn.ghost{background:rgba(122,81,56,.12);color:var(--ink);box-shadow:none;
  border:1.5px solid rgba(122,81,56,.3);}
.btn:active{transform:scale(.97);}

/* 胜利花瓣 */
.petal{position:fixed;width:14px;height:14px;z-index:60;pointer-events:none;
  border-radius:60% 40% 60% 40%;
  animation:petalfall linear forwards;}
@keyframes petalfall{
  0%{transform:translateY(-30px) rotate(0);opacity:1;}
  85%{opacity:1;}
  100%{transform:translateY(105vh) rotate(560deg);opacity:0;}
}

@media (max-height:700px){
  #stage{min-height:142px;}
  #shijie{width:106px;}
  #bubble{bottom:74px;right:94px;}
}
</style>
</head>

<script>
/* =====================================================================

var WORLD_LEVELS = [
  {grid:'YYYYYYYYYYYYYRRRRRYYYYRRRRRYYYYRRRRRYYYYRRRRRYYYYRRRRRYYYYRRRRR',target:1,budget:1,tap:[2, 5],seq:'Y'},

  {grid:'RRYRRRRRRRRYRRRRRRBBYBBBBBBBBYBBBBBBGGYGGGGGGGGYGGGGGGRRYRRRRRR',target:2,budget:3,tap:[1, 3],seq:'RGB'},
  {grid:'RRBBBBRRRGGGGGGGGGRRBBBBRRRGGGGGGGGRRRBBBBRRRRRRRRRRRRRRBBBBRRR',target:3,budget:3,tap:[2, 1],seq:'RBG'},
  {grid:'YYYYYYYGGBBBBBGGGGYYYYYYYYRGGRRRRRRRBBBBBBBBGYYGGGGGGGYYRRRRRRR',target:0,budget:4,tap:[3, 9],seq:'GYBR'},
  {grid:'GGGGGGGRRYYYYYBBBRYBRRRRRBRYBGGGGRBRYBGGRRRYRRBBYYYYYRRRRRBBBRR',target:3,budget:4,tap:[3, 3],seq:'YRBG'},
  {grid:'GGGGGYYYYYYYYYRRRYYRRGGGGRYYRYYRRGRYYRYYYYGRYYRRBBBBBYGGGGRRRRR',target:0,budget:4,tap:[2, 6],seq:'BYGR'},
  {grid:'RGYBRGBRGRGYBRBRRBRGYBBBRBGRGYBRBRRGRGBYRBRRGRBYYRBRRGGGYYRBRRG',target:2,budget:5,tap:[1, 8],seq:'BYGRB'},

  if(!soundOn) return; var ctx = ac(); if(!ctx) return;

  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+d+0.05);
}

/* ---------- 棋盘算法 ---------- */
function neighbors(i){
  var r = (i/COLS)|0, c = i%COLS, out = [];
  if(c>0) out.push(i-1); if(c<COLS-1) out.push(i+1);
  if(r>0) out.push(i-COLS); if(r<ROWS-1) out.push(i+COLS);
  return out;
}
function flood(b, seed){
  var col = b[seed], seen = new Uint8Array(N), stack = [seed], region = [];
  seen[seed] = 1;
  while(stack.length){
    var i = stack.pop(); region.push(i);
    var nb = neighbors(i);
    for(var k=0;k<nb.length;k++){ var j = nb[k]; if(!seen[j] && b[j]===col){ seen[j]=1; stack.push(j); } }
  }
  return region;
}
function components(b){
  var seen = new Uint8Array(N), comps = [];
  for(var i=0;i<N;i++){ if(seen[i]) continue; var cells = flood(b,i);
    for(var k=0;k<cells.length;k++) seen[cells[k]]=1;
    comps.push({cells:cells, color:b[i]}); }
  return comps;
}
function growRegion(b, region, c){
  var seen = new Uint8Array(N), i, k, stack = [];
  for(i=0;i<region.length;i++) seen[region[i]]=1;
  var out = region.slice();
  for(i=0;i<region.length;i++){ var nb = neighbors(region[i]);
    for(k=0;k<nb.length;k++){ var j = nb[k]; if(!seen[j] && b[j]===c){ seen[j]=1; stack.push(j); } } }
  while(stack.length){ var x = stack.pop(); out.push(x);
    var nb2 = neighbors(x);
    for(k=0;k<nb2.length;k++){ var j2 = nb2[k]; if(!seen[j2] && b[j2]===c){ seen[j2]=1; stack.push(j2); } } }
  return out;
}
function greedySolve(b, targetColor){
  var comps = components(b), bestComp = comps[0], i;
  for(i=1;i<comps.length;i++) if(comps[i].cells.length > bestComp.cells.length) bestComp = comps[i];
  var sim = b.slice(), region = bestComp.cells.slice(), col = bestComp.color, steps = 0, guard = 0;
  while(region.length < N && guard < 80){
    guard++;
    var bestGain = -1, bestC = col, bestR = region;
    for(var c=0;c<4;c++){ if(c===col) continue;
      var r2 = growRegion(sim, region, c), gain = r2.length - region.length;
      if(gain > bestGain){ bestGain = gain; bestC = c; bestR = r2; } }
    for(i=0;i<region.length;i++) sim[region[i]] = bestC;
    region = bestR; col = bestC; steps++;
  }
  if(col !== targetColor) steps++;
  return steps;
}
function allSame(b, c){ for(var i=0;i<N;i++) if(b[i]!==c) return false; return true; }
function ri(n){ return Math.floor(Math.random()*n); }

/* ---------- 交互 ---------- */
var SPLASH_CSS = ["#f2a398", "#f6dd8d", "#a7c9f0", "#a6e2ad"];
function onCellTap(idx, el, ev){
  if(over) return;
  if(board[idx] === brush){
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    sfx.bad();
    return;
  }
  /* 逻辑即时生效 */
  var region = flood(board, idx), i;
  var regionSet = new Uint8Array(N);
  for(i=0;i<region.length;i++){ board[region[i]] = brush; regionSet[region[i]] = 1; }
  stepsLeft--;
  sfx.dye(brush);

  /* 染色泼溅：从点击格向外按 BFS 距离逐格扩散（游戏内同款） */
  var dist = new Int16Array(N).fill(-1);
  dist[idx] = 0;
  var q = [idx], maxD = 0;
  while(q.length){
    var cur = q.shift(), nb = neighbors(cur);
    for(i=0;i<nb.length;i++){
      var j = nb[i];
      if(regionSet[j] && dist[j] < 0){ dist[j] = dist[cur] + 1; if(dist[j] > maxD) maxD = dist[j]; q.push(j); }
    }
  }
  for(i=0;i<region.length;i++){
    (function(cellIdx, d){
      setTimeout(function(){
        var cellEl = cellEls[cellIdx];
        cellEl.className = "cell c" + board[cellIdx];
        var sp = document.createElement("span");
        sp.className = "splash";
        sp.style.setProperty("--sc", SPLASH_CSS[brush]);
        cellEl.appendChild(sp);
        setTimeout(function(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 420);
      }, d * 40);
    })(region[i], dist[region[i]]);
  }
  renderHUD();

  var settle = maxD * 40 + 420;
  if(allSame(board, target)){ setTimeout(winSeq, Math.max(200, settle - 250)); over = true; return; }
  if(stepsLeft <= 0){ over = true; setTimeout(loseSeq, Math.max(150, settle - 250)); }
}

  for(var i=0;i<count;i++){
    var open = (i === 0) || done[i-1];
    html += "<div class='chip" + (i===cur ? " cur" : "") + (done[i] ? " done" : "") + (!open ? " lock" : "") + "' data-i='" + i + "'>"
          + (open ? (i+1) : lockSvg) + "</div>";
  }
  $("chips").innerHTML = html;
  var list = $("chips").children;
  for(var k=0;k<list.length;k++){
    (function(el){
      el.addEventListener("pointerdown", function(ev){
        ev.preventDefault();
        var i = parseInt(el.getAttribute("data-i"), 10);
        var open = (i === 0) || done[i-1];
        if(!open){
          el.classList.remove("shake2"); void el.offsetWidth; el.classList.add("shake2");
          sfx.bad();
          toast("这关还锁着，先通关前面的关卡");
          return;
        }
        jumpLevel(i);
        sfx.pick();
      });
    })(list[k]);
  }
}

function petalRain(){

    var c = document.createElement("div");
    c.className = "petal";
    c.style.left = (Math.random()*100) + "vw";
    c.style.top = "-30px";
    var s = 9 + Math.random()*10;
    c.style.width = s + "px"; c.style.height = s + "px";
    c.style.background = PETAL_COLORS[ri(4)];
    c.style.animationDuration = (1.2 + Math.random()*1.2) + "s";
    c.style.animationDelay = (Math.random()*0.45) + "s";

  }
}

function flashCell(i){
  var el = cellEls[i];
  el.classList.remove("guideflash"); void el.offsetWidth;
  el.classList.add("guideflash");
  setTimeout(function(){ el.classList.remove("guideflash"); }, 2600);

function showGuide(){
  var L = (mode === "world") ? WORLD_LEVELS[worldIdx] : TRAIN_LEVELS[round-1];
  if(!L.tap || !L.seq) return;
  var seqHtml = L.seq.split("").map(function(ch, i){
    return (i ? " → " : "") + "<b style='color:" + GUIDE_COLORS[ch] + "'>" + GUIDE_NAMES[ch] + "</b>";
  }).join("");
  showOverlay({
    title: "师姐的最优解",
    sub: "点<b>第 " + L.tap[0] + " 行第 " + L.tap[1] + " 列</b>那一格，<br>一直点它、别换地方。<br>画笔顺序：" + seqHtml + "<br>共 " + L.seq.length + " 步，一步都不浪费。",
    gain: "",
    btns: [{label:"知道了", fn:function(){

}

var TUT = [
  {sel:null,        text:"欢迎来到妙手回春！我是师姐，用 30 秒带你上手。"},
  {sel:"#quest",    text:"这里是本关目标：把所有颜色格恢复成指定颜色。"},
  {sel:"#stepsline",text:"这是剩余步数——每染一块区域，消耗 1 步。步数用完还没同色就失败。"},
  {sel:"#brushes",  text:"先在这里选一支画笔（颜色）。"},
  {sel:"#boardwrap",text:"再点棋盘上的格子——它所在的整片连通同色区域，都会变成画笔色。"},
  {sel:null,        text:"心法：盯准最大的一块区域，围着它换色。一关失败三次，或是点击师姐三次，我会偷偷来帮你。去吧！"}
];
var tutIdx = 0;
function tutShow(i){
  tutIdx = i;
  var s = TUT[i];
  $("tuttxt").textContent = s.text;
  $("tutnext").textContent = (i === TUT.length-1) ? "开始吧" : "下一步";
  var dots = "";
  for(var k=0;k<TUT.length;k++) dots += "<i class='" + (k===i?"on":"") + "'></i>";
  $("tutdots").innerHTML = dots;
  var hole = $("tuthole"), card = $("tutcard");
  card.style.left = "50%";
  card.style.transform = "translateX(-50%)";
  if(!s.sel){
    hole.style.width = "0px"; hole.style.height = "0px";
    hole.style.left = "50%"; hole.style.top = "38%";
    card.style.top = "28%";
  }else{
    var r = document.querySelector(s.sel).getBoundingClientRect();
    var pad = 6;
    hole.style.left = (r.left-pad) + "px";
    hole.style.top = (r.top-pad) + "px";
    hole.style.width = (r.width+pad*2) + "px";
    hole.style.height = (r.height+pad*2) + "px";
    var cardH = 190, top = r.bottom + 12;
    if(top + cardH > window.innerHeight - 12) top = r.top - cardH - 12;
    if(top < 8) top = 8;
    card.style.top = top + "px";
  }
}
function tutStart(){ tutIdx = 0; $("tut").classList.add("show"); tutShow(0); }
function tutEnd(){
  $("tut").classList.remove("show");
  localStorage.setItem("mshc_tut", "1");
}
$("tutnext").addEventListener("click", function(){
  sfx.pick();
  if(tutIdx >= TUT.length-1) tutEnd(); else tutShow(tutIdx+1);
});
$("tutskip").addEventListener("click", function(){ sfx.pick(); tutEnd(); });
$("btnTut").addEventListener("click", function(){ sfx.pick(); tutStart(); });
